<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{background:#111;color:#ddd;font:15px system-ui;padding:28px}button{background:#292929;color:inherit;border:1px solid #555;border-radius:12px;padding:12px;cursor:pointer}p{font-size:13px;color:#aaa}</style><h1>Counter</h1><button disabled>Increment</button><p></p><script src="/sdk.js"></script><script>(async()=>{const ink=await Ink.connect();ink.ready();const button=document.querySelector('button'),output=document.querySelector('p'),state=await ink.state.open();const render=()=>output.textContent=String(state.get('counter',{count:0}).count);state.subscribe(event=>{if(event.type==='change')render();});render();button.disabled=false;button.onclick=async()=>{button.disabled=true;try{const response=await ink.backend.request('/increment',{method:'POST',body:{}});if(response.status!==200)throw Error(response.body.error||'Increment failed');}catch(error){output.textContent=error.message;}finally{button.disabled=false;}};addEventListener('pagehide',()=>void state.close());})().catch(error=>document.querySelector('p').textContent=error.message);</script>
