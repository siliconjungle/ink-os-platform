name: Check
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      composeBase64:
        description: Canonical deployment Compose file, encoded as base64
        required: false
        type: string
      toolchainBase64:
        description: Exact managed-toolchain installer/verifier source bundle, encoded as base64 gzip JSON
        required: false
        type: string
      toolchainApiBootstrap:
        description: Verify cold-cache bootstrap through the durable owner API build queue
        required: false
        type: boolean
        default: false
jobs:
  platform:
    if: github.event_name != 'workflow_dispatch' || inputs.composeBase64 == '' && inputs.toolchainBase64 == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run audit
      - run: npm run build
      - run: npm test
  native:
    if: github.event_name != 'workflow_dispatch' || inputs.composeBase64 == '' && inputs.toolchainBase64 == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: INK_TEST_NATIVE=1 node --test tests/native-*.test.mjs
  container:
    if: github.event_name != 'workflow_dispatch' || inputs.composeBase64 == '' && inputs.toolchainBase64 == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ink-os-check .
      - run: docker run -d --name ink-os-check -p 127.0.0.1:4318:4318 ink-os-check
      - run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4318/api/health; then exit 0; fi
            sleep 1
          done
          docker logs ink-os-check
          exit 1
      - run: docker exec ink-os-check node --input-type=module -e 'import{readFile}from"node:fs/promises";const c=JSON.parse(await readFile("/data/client.json"));const r=await fetch(c.url+"/api/v1/apps",{headers:{authorization:"Bearer "+c.token}});const apps=await r.json();if(!r.ok||!Array.isArray(apps)||apps.length)process.exit(1);console.log("Authenticated container starts with zero apps");'
      - run: docker exec ink-os-check node cli/bin/ink-os.mjs init /tmp/ink-container-proof --slug container-proof
      - run: docker exec -e INK_OS_CONFIG=/data/client.json ink-os-check node cli/bin/ink-os.mjs deploy /tmp/ink-container-proof
      - run: |
          docker exec ink-os-check node -e 'const fs=require("fs");(async()=>{const c=JSON.parse(fs.readFileSync("/data/client.json")),headers={authorization:"Bearer "+c.token,"content-type":"application/json"};const apps=await(await fetch(c.url+"/api/v1/apps",{headers})).json();if(apps.length!==1)throw Error("Expected the explicitly installed app");const r=await fetch(c.url+"/api/v1/commands/run",{method:"POST",headers,body:JSON.stringify({appId:apps[0].id,id:"ink.add",input:{arg0:"3"}})});const result=await r.json();if(!r.ok||result.data.valueWire!=="3")throw Error(JSON.stringify(result));console.log("Container compiled and ran an Ink app from local Git");})().catch(e=>{console.error(e);process.exit(1)})'
      - if: always()
        run: docker rm -f ink-os-check || true
  docker-backends:
    if: github.event_name != 'workflow_dispatch' || inputs.composeBase64 == '' && inputs.toolchainBase64 == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: docker build --target runtime -t ink-os-runtime:local .
      - run: docker build -f tests/fixtures/Dockerfile.oci -t ink-os-oci-proof:local .
      - run: INK_TEST_DOCKER=1 node --test tests/docker-backends.test.mjs
  compose:
    if: github.event_name == 'workflow_dispatch' && inputs.composeBase64 != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ink-os-platform
    env:
      COMPOSE_PROJECT_NAME: ink-os-proof-${{ github.run_id }}
      INK_OS_DOCKER_NETWORK: ink-os-proof-${{ github.run_id }}
      INK_OS_DOCKER_RUNTIME_IMAGE: ink-os-runtime:proof-${{ github.run_id }}
      INK_OS_DOCKER_IDLE_MS: "1000"
    steps:
      - uses: actions/checkout@v4
        with:
          path: ink-os-platform
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Decode exact deployment source
        env:
          PROOF_COMPOSE: ${{ inputs.composeBase64 }}
        run: |
          node --input-type=module -e 'import{mkdir,writeFile}from"node:fs/promises";const bytes=Buffer.from(process.env.PROOF_COMPOSE,"base64");if(bytes.length>32768||bytes.toString("base64")!==process.env.PROOF_COMPOSE)throw Error("Invalid Compose input");await mkdir("../ink-os-deploy");await writeFile("../ink-os-deploy/compose.yaml",bytes);'
      - run: docker compose -f ../ink-os-deploy/compose.yaml config --quiet
      - run: docker compose -f ../ink-os-deploy/compose.yaml up --build -d --wait
      - run: INK_OS_COMPOSE_FILE=../ink-os-deploy/compose.yaml node scripts/verify-compose.mjs
      - if: always()
        run: docker compose -f ../ink-os-deploy/compose.yaml down --volumes --remove-orphans
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: compose-proof
          path: ink-os-platform/evidence/compose.json
          retention-days: 7
  managed-native:
    if: github.event_name == 'workflow_dispatch' && inputs.toolchainBase64 != ''
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ink-os-platform
    steps:
      - uses: actions/checkout@v4
        with:
          path: ink-os-platform
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Decode exact toolchain verifier source
        env:
          PROOF_TOOLCHAIN: ${{ inputs.toolchainBase64 }}
        run: |
          node --input-type=module -e 'import{mkdir,writeFile}from"node:fs/promises";import{gunzipSync}from"node:zlib";const compressed=Buffer.from(process.env.PROOF_TOOLCHAIN,"base64");if(process.env.PROOF_TOOLCHAIN.length>65000||compressed.toString("base64")!==process.env.PROOF_TOOLCHAIN)throw Error("Invalid toolchain input");const bytes=gunzipSync(compressed,{maxOutputLength:262144});const source=JSON.parse(bytes);if(typeof source.installer!=="string"||typeof source.verifier!=="string"||Object.keys(source).length!==2)throw Error("Invalid source bundle");await mkdir("../ink-os-desktop/src",{recursive:true});await mkdir("../ink-os-desktop/scripts");await writeFile("../ink-os-desktop/src/native-toolchain.mjs",source.installer);await writeFile("../ink-os-desktop/scripts/verify-native-toolchain.mjs",source.verifier);'
      - name: Install the API host dependencies
        if: inputs.toolchainApiBootstrap
        run: npm ci
      - name: Build the API host interface
        if: inputs.toolchainApiBootstrap
        run: npm run build
      - name: Verify the selected managed native path
        env:
          PROOF_API: ${{ inputs.toolchainApiBootstrap }}
        run: |
          args=(--output evidence/managed-native.json --ephemeral-runner --reserve-gib 2 --platform-dir .)
          if [[ "$PROOF_API" == "true" ]]; then args+=(--api-bootstrap); fi
          node ../ink-os-desktop/scripts/verify-native-toolchain.mjs "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: managed-native-proof
          path: |
            ink-os-platform/evidence/managed-native.json
            ink-os-platform/evidence/managed-native.json.licenses
          retention-days: 7
