name: Check
on: [push, pull_request]
jobs:
  platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run audit
      - run: npm run build
      - run: npm test
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: INK_TEST_NATIVE=1 node --test tests/native-*.test.mjs
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ink-os-check .
      - run: docker run -d --name ink-os-check -p 127.0.0.1:4318:4318 ink-os-check
      - run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4318/api/health; then exit 0; fi
            sleep 1
          done
          docker logs ink-os-check
          exit 1
      - run: docker exec ink-os-check node --input-type=module -e 'import{readFile}from"node:fs/promises";const c=JSON.parse(await readFile("/data/client.json"));const r=await fetch(c.url+"/api/v1/apps",{headers:{authorization:"Bearer "+c.token}});const apps=await r.json();if(!r.ok||!Array.isArray(apps)||apps.length)process.exit(1);console.log("Authenticated container starts with zero apps");'
      - run: docker exec ink-os-check node cli/bin/ink-os.mjs init /tmp/ink-container-proof --slug container-proof
      - run: docker exec -e INK_OS_CONFIG=/data/client.json ink-os-check node cli/bin/ink-os.mjs deploy /tmp/ink-container-proof
      - run: |
          docker exec ink-os-check node -e 'const fs=require("fs");(async()=>{const c=JSON.parse(fs.readFileSync("/data/client.json")),headers={authorization:"Bearer "+c.token,"content-type":"application/json"};const apps=await(await fetch(c.url+"/api/v1/apps",{headers})).json();if(apps.length!==1)throw Error("Expected the explicitly installed app");const r=await fetch(c.url+"/api/v1/commands/run",{method:"POST",headers,body:JSON.stringify({appId:apps[0].id,id:"ink.add",input:{arg0:"3"}})});const result=await r.json();if(!r.ok||result.data.valueWire!=="3")throw Error(JSON.stringify(result));console.log("Container compiled and ran an Ink app from local Git");})().catch(e=>{console.error(e);process.exit(1)})'
      - if: always()
        run: docker rm -f ink-os-check || true
