[package]
license = "MIT"
name = "ink-browser-compiler"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ink-lowering-rust = { git = "https://github.com/siliconjungle/ink-lowering-rust", rev = "b9d7d7125d12a1c209e026b09a0da379148bb4dc" }
ink-core = { git = "https://github.com/siliconjungle/ink-lang", rev = "e5364895ccc2c4e0f512ed65cf6e4236c83e20f6" }
ink-lowering-js = { git = "https://github.com/siliconjungle/ink-lowering-js", rev = "4a0e19c4329733c26f0fb366f274742d82a27305" }
ink-lowering-gpu = { git = "https://github.com/siliconjungle/ink-lowering-gpu", rev = "5eced4392bf811bc061c439f9c121757c6d1cb21" }
ink-lowering-wasm = { git = "https://github.com/siliconjungle/ink-lowering-wasm", rev = "cf53edb046033763d2c4c9878601eb915735f2e5" }
ink-abi = { git = "https://github.com/siliconjungle/ink-abi", rev = "8f9de93cf30bf658195bb94ad7ebba9e37bf1c05" }
sha2 = "0.10"
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"
strip = true

[workspace]
