[package]
license = "MIT"
name = "ink-browser-compiler"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ink-lowering-rust = { git = "https://github.com/siliconjungle/ink-lowering-rust", rev = "30f573c9dd687c10aefdd0aef97bbccca1b7924d" }
ink-core = { git = "https://github.com/siliconjungle/ink-lang", rev = "71ca03305355d92601bf10676ef22a7f9dce9a74" }
ink-lowering-js = { git = "https://github.com/siliconjungle/ink-lowering-js", rev = "28288fee43095a6b7ebbaebe4dcceb8321c640db" }
ink-lowering-gpu = { git = "https://github.com/siliconjungle/ink-lowering-gpu", rev = "0c8e91bacd3547d6fbb6b4a99dd6f0dff1f6adfe" }
ink-lowering-wasm = { git = "https://github.com/siliconjungle/ink-lowering-wasm", rev = "96359354c78e1249f3de3354a67f61cd551a8102" }
ink-abi = { git = "https://github.com/siliconjungle/ink-abi", rev = "8f9de93cf30bf658195bb94ad7ebba9e37bf1c05" }
sha2 = "0.10"
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"
strip = true

[workspace]
