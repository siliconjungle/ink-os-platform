[package]
license = "MIT"
name = "ink-browser-compiler"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ink-lowering-rust = { git = "https://github.com/siliconjungle/ink-lowering-rust", rev = "67e2d5f095bda42369bd5a87d5b2faa97c4e825f" }
ink-core = { git = "https://github.com/siliconjungle/ink-lang", rev = "6229997ba04f3e00068583e3ca225b88da1373e0" }
ink-lowering-js = { git = "https://github.com/siliconjungle/ink-lowering-js", rev = "2ed6bfc2904a1eaff14772596afa0eb33bd9493b" }
ink-lowering-gpu = { git = "https://github.com/siliconjungle/ink-lowering-gpu", rev = "dbbddb4a08806b345646030302116478dfc5fcbd" }
ink-lowering-wasm = { git = "https://github.com/siliconjungle/ink-lowering-wasm", rev = "d5ae3db97d1e37213c6f291b4d87567b7077f6c7" }
ink-abi = { git = "https://github.com/siliconjungle/ink-abi", rev = "8f9de93cf30bf658195bb94ad7ebba9e37bf1c05" }
sha2 = "0.10"
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"
strip = true

[workspace]
